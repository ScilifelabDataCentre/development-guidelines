<svg xmlns="http://www.w3.org/2000/svg" width="390" height="245" viewBox="0 0 390 245" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Example 'About' section of a GitHub repository</title>
  <desc id="desc">The About section of the SciLifeLab Serve repository: a heading, a one-paragraph description, and a link to serve.scilifelab.se.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 17px; font-weight: 600; }
    .p { font-size: 15.5px; }
    .a { font-size: 15.5px; font-weight: 600; fill: #0969da; }
    .icon { fill: none; stroke: #59636e; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="390" height="245" fill="#ffffff"/>

  <text class="h" x="16" y="36">About</text>

  <!-- gear icon -->
  <g class="icon" transform="translate(303 30)">
    <path d="M0 -7.5V-5.3M0 5.3V7.5M-7.5 0H-5.3M5.3 0H7.5M-5.3 -5.3L-3.75 -3.75M3.75 3.75L5.3 5.3M-5.3 5.3L-3.75 3.75M3.75 -3.75L5.3 -5.3" stroke-width="2.6"/>
    <circle r="4.8"/>
    <circle r="2"/>
  </g>

  <text class="p" x="16" y="78">SciLifeLab Serve is a platform offering</text>
  <text class="p" x="16" y="103">machine learning model serving, data</text>
  <text class="p" x="16" y="128">science app hosting (Shiny, Gradio,</text>
  <text class="p" x="16" y="153">Streamlit, Dash, etc.), and other tools to</text>
  <text class="p" x="16" y="178">life science researchers affiliated with a</text>
  <text class="p" x="16" y="203">Swedish research institute.</text>

  <!-- link icon -->
  <g class="icon" transform="translate(23 229) rotate(-45)">
    <rect x="-8" y="-3.2" width="9" height="6.4" rx="3.2"/>
    <rect x="-1" y="-3.2" width="9" height="6.4" rx="3.2"/>
  </g>
  <a href="https://serve.scilifelab.se">
    <text class="a" x="40" y="234">serve.scilifelab.se</text>
  </a>
</svg>
