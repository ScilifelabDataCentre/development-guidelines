# Flag outdated files
# 
# Scans the repository, finds files that need 1. metadata, 2. correction, 3. review, 
# and opens/updates a GitHub issue containing the results from the latest workflow run.
#
# Want to exclude a file or directory from this workflow? -> Add it to ''.config/flag-outdated/excluded-paths.txt'.
---
name: Flag outdated files

on:
  pull_request: # temporary, just to test the workflow
  workflow_dispatch:
    inputs:
      # Adds checkbox labelled "Enable debug logging"
      debug:
        type: boolean
        default: false
  schedule:
    - cron: "0 0 1 * *" # Run the first day of every month, at midnight

permissions:
  contents: read
  issues: write

jobs:
  flag-outdated:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Python 3.13 needed for python-frontmatter
      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install python-frontmatter
        run: pip install python-frontmatter

      # Python script takes a file containing list of files to exclude from the scan
      # runner.debug == '1' -> true if workflow re-run with "Enable debug logging"
      # inputs.debug -> true if debugging checkbox ticket on manual run
      # && '--debug' || '' -> true in one of the above gives --debug, false gives empty string
      - name: Run python script
        run: >
          python .config/flag-outdated/check_for_last_reviewed.py 
          .config/flag-outdated/excluded-paths.txt
          ${{ (runner.debug == '1' || inputs.debug) && '--debug' || '' }}

      # Find existing issue with label
      # Outputs issue-number -> used in next step
      - name: Check if there's an existing issue
        id: last-issue
        uses: micalevisk/last-issue-action@v2
        with:
          state: open
          labels: flag-outdated

      # Issue is created or updated with the output from the Python script: a markdown file
      - name: Create or update issue
        uses: peter-evans/create-issue-from-file@v6 # peter-evans used in other workflows already
        with: # Metadata for issue
          title: Outdated files
          content-filepath: ./outdated-results.md
          issue-number: ${{ steps.last-issue.outputs.issue-number }} # output from last step
          labels: flag-outdated
