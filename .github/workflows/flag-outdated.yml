---
name: Flag outdated files

on:
  pull_request: # temporary, just to test the workflow
  # later add schedule and manual triggers

permissions:
  contents: read

jobs:
  some_name:
    runs-on: ubuntu-24.04

    steps: 
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7            

      # 2. Setup Python 3.13
      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      
      # 3. Install python-frontmatter
      - name: Install python-frontmatter
        run: pip install python-frontmatter
      
      # 3. Run Python script
      # use excluded paths file as input variable
      # let python handle repo contents and find the correct files to check
      - name: Run python script
        run: python .config/flag-outdated/check_for_last_reviewed.py .config/fla-outdated/excluded-paths.txt
      
      # 4. Print output or let python do it? 
