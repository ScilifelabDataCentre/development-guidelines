# Testing that this works
---
name: Links

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Run once a day at midnight

jobs:
  link-checker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: ${{ github.event_name == 'pull_request' }}
        
      - name: Upload Report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee/out.md

  update-issue:
    if: github.event_name != 'pull_request' && needs.link-checker.outputs.exit_code != 0
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    needs: link-checker
    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: lychee-report
          path: ./lychee

      - name: Check if there's an existing issue
        id: last-issue
        uses: micalevisk/last-issue-action@v2
        with:
          state: open
          labels: lychee, links

      - name: Create Issue From File
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.last-issue.outputs.issue-number }}
          labels: lychee, links
